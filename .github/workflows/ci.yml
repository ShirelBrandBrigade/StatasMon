name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: swatinem/rust-cache@v2
      - name: Linux build dependencies (webkit2gtk for the Tauri crate)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: pnpm install --frozen-lockfile
      # The Tauri build script insists the bundled-adb resource folder is real.
      - name: Bundle Android platform-tools
        shell: bash
        run: bash scripts/fetch-platform-tools.sh
      - run: pnpm lint
      - run: pnpm protocol:gen
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm --filter @statasmon/desktop build
      - if: runner.os == 'macOS'
        run: pnpm --filter @statasmon/desktop exec playwright install --with-deps chromium
      - if: runner.os == 'macOS'
        run: pnpm --filter @statasmon/desktop e2e
        env: { CI: "1" }
