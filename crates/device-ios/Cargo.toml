[package]
name = "statasmon-device-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "iOS/iPadOS provider via the idevice crate: usbmuxd, lockdown, diagnostics, logs, crashes, pcap (tier 1); tunnel + DVT (tier 2)"

[dependencies]
statasmon-protocol = { workspace = true }
statasmon-device = { workspace = true }
statasmon-idmap = { workspace = true }
idevice = { version = "0.1.65", default-features = false, features = ["ring", "usbmuxd", "pair", "diagnostics_relay", "installation_proxy", "syslog_relay", "pcapd", "crashreportcopymobile", "afc", "amfi", "heartbeat", "tcp", "rsd", "core_device_proxy", "tunnel_tcp_stack", "xpc", "dvt", "sysmontap", "network_monitor", "device_info", "energy_monitor"] }
plist = "1.8"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
futures = "0.3"

[dev-dependencies]
statasmon-core = { workspace = true }
statasmon-device-android = { workspace = true }

[lints]
workspace = true
